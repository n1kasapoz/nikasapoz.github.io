name: Create Nikasapoz short link (one time)
on:
  push:
    paths:
      - .github/workflows/create-short-link-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create-short-link:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Try free URL shorteners
        shell: bash
        run: |
          set -eu
          dest="https://nikaaaaaw.github.io/nikasapoz.github.io/links/"
          echo "Trying v.gd with NikasapozLinks"
          curl -sS -L --connect-timeout 10 --max-time 20 -G             --data-urlencode "format=json" --data-urlencode "url=$dest"             --data-urlencode "shorturl=NikasapozLinks"             "https://v.gd/create.php" || true
          echo
          echo "Trying TinyURL"
          curl -sS -L --connect-timeout 10 --max-time 20 -G             --data-urlencode "url=$dest"             "https://tinyurl.com/api-create.php" || true
          echo
